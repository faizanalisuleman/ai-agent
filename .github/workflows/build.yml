name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Zip kholo aur project banao
        run: |
          unzip -q ai_agent_project.zip
          flutter create --org com.example --project-name ai_agent --platforms android build_app
          rm -rf build_app/lib build_app/test
          cp -r ai_agent_project/lib build_app/lib
          cp ai_agent_project/pubspec.yaml build_app/pubspec.yaml
          cp -r ai_agent_project/android/app/src/main/. build_app/android/app/src/main/
      - name: APK build
        run: |
          cd build_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ai-agent-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
